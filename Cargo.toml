[package]
name = "csi-webserver-core"
version = "0.2.0"
edition = "2024"
description = "Embeddable HTTP/WebSocket library for streaming ESP32 CSI data over USB serial"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/csi-rs/csi-webserver-core-rs"
documentation = "https://docs.rs/csi-webserver-core"
keywords = ["esp32", "csi", "websocket", "serial", "axum"]
categories = ["web-programming::http-server", "network-programming", "api-bindings"]
rust-version = "1.85"
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]
authors = ["stacks-of-data", "theembeddedrustacean"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
axum = { version = "0.8.8", features = ["ws"] }
# Named features rather than `full`. `full` is 9.2s to compile and pulls `fs`, `io-std`, `process`,
# `parking_lot` and `signal-hook-registry` — and because feature unification is per-graph, it forced them
# on every consumer too: a downstream crate inherited `full` from here even though its own manifest asked
# for seven features. What this crate actually uses is tokio::{io, net, select, spawn, sync, task, time}.
tokio = { version = "1.50.0", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "net",
    "io-util",
    "time",
] }
tokio-serial = "5.4.5"
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["clock"] }
postcard = { version = "1", features = ["use-std"] }
# The `arrow` facade is deliberately not used — it is the sole parent of arrow-cast, arrow-ord,
# arrow-arith, arrow-row, arrow-string, arrow-csv and arrow-json, none of which this crate touches
# (`parquet_sink.rs` uses only array/datatypes/record_batch/error). Feature unification applies here
# too: a default-featured `arrow` in this crate would put the whole umbrella back into every
# consumer's graph regardless of what the consumer asks for.
arrow-array = "59"
arrow-schema = "59"
# SNAPPY is what this sink writes; zstd is kept for consumers that share this `parquet` dependency to
# write and read zstd-compressed files, which is the other codec in use downstream.
parquet = { version = "59", default-features = false, features = ["arrow", "zstd", "snap"] }
